# Opt into one imported reference run for the chat.
services:
  backend:
    environment:
      GRAPH_RUN_DIR: /reference-run
    volumes:
      - type: bind
        source: ${GRAPH_RUN_DIR:?Set GRAPH_RUN_DIR to the imported ingestion run}
        target: /reference-run
        read_only: true
        bind:
          create_host_path: false
