services:
  graphify:
    build:
      context: ./docker/graphify
    image: graphify:dev
    working_dir: /output
    volumes:
      - type: bind
        source: ${SOURCE_DIR:-./test-project}
        target: /source
        read_only: true
      - type: bind
        source: ${OUTPUT_DIR:-./output}
        target: /output
    command:
      - sh
      - -c
      - "graphify extract /source --out /output --code-only && graphify export html && graphify cluster-only /output"
