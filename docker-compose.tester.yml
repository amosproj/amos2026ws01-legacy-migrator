# Run the mid-project demo using a matching pair of prebuilt images.
x-backend-image: &backend-image "${SUNSETTRACKER_BACKEND_IMAGE:-ghcr.io/amosproj/amos2026ws01-legacy-migrator-backend:${SUNSETTRACKER_IMAGE_TAG:-develop}}"

services:
  neo4j:
    image: neo4j:2026.10.2
    environment:
      NEO4J_AUTH: neo4j/change-this
    healthcheck:
      test: [CMD, cypher-shell, -u, neo4j, -p, change-this, "RETURN 1;"]
      interval: 3s
      timeout: 10s
      retries: 30
    volumes:
      - neo4j-data:/data

  ingestion:
    image: *backend-image
    platform: linux/amd64
    user: "0:0"
    entrypoint: [python, /tester/tester_ingest.py]
    environment:
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${REFERENCE_SOURCE:?Set the reference repository path}
        target: /reference
        read_only: true
        bind:
          create_host_path: false
      - ./backend/code-ingestion-pipeline/tester_ingest.py:/tester/tester_ingest.py:ro
      - ./backend/code-ingestion-pipeline/config/reference-source.yaml:/tester/reference-source.yaml:ro
      - graph-run:/graph-run

  backend:
    image: *backend-image
    platform: linux/amd64
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      GRAPH_RUN_DIR: /graph-run/current
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_NAME: ${LLM_NAME:-qwen3.5:2b}
      LLM_EXTRA_BODY: '{"reasoning_effort":"none","think":false,"temperature":0}'
    depends_on:
      ingestion:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - graph-run:/graph-run:ro

  frontend:
    image: "${SUNSETTRACKER_FRONTEND_IMAGE:-ghcr.io/amosproj/amos2026ws01-legacy-migrator-frontend:${SUNSETTRACKER_IMAGE_TAG:-develop}}"
    platform: linux/amd64
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j-data:
  graph-run:
