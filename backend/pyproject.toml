[project]
name = "sunsettracker-backend"
version = "0.1.0"
description = "SunsetTracker backend query API (AMOS 2026 WS01, ticket #24)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic>=2",
    "pyyaml>=6",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "httpx2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]